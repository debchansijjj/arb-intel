[project]
name = "arb-intel"
version = "0.1.0"
description = "Cross-chain / cross-DEX arbitrage intelligence system with anti-fake heuristics, lagging-pool detection and Telegram alerts."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "arb-intel" }]

dependencies = [
  # ---- core async / web ----
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "orjson>=3.10",
  "structlog>=24.4",
  "anyio>=4.4",
  "httpx>=0.27",
  "websockets>=13.1",
  "tenacity>=9.0",
  "uvloop>=0.20; platform_system != 'Windows'",
  "python-dateutil>=2.9",
  "python-dotenv>=1.0",

  # ---- storage ----
  "SQLAlchemy[asyncio]>=2.0.34",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "redis>=5.0",
  "hiredis>=2.3",

  # ---- evm ----
  "web3>=7.2",
  "eth-utils>=5.0",
  "eth-abi>=5.1",
  "eth-typing>=5.0",

  # ---- solana ----
  "solana>=0.34",
  "solders>=0.21",
  "construct>=2.10",
  "base58>=2.1",
  "grpcio>=1.66",
  "grpcio-tools>=1.66",
  "protobuf>=5.27",

  # ---- telegram ----
  "aiogram>=3.13",
  "aiolimiter>=1.1",

  # ---- math / quant ----
  "numpy>=1.26",
  "pandas>=2.2",

  # ---- observability ----
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-redis",
  "types-protobuf",
]

[project.scripts]
arb-intel = "arb_intel.main:main"
arb-intel-worker = "arb_intel.workers.entrypoint:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arb_intel"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["alembic/versions", "rust_ext"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "ASYNC", "SIM", "C4", "PIE", "RUF"]
ignore = [
  "E501",   # line length handled by formatter
  "B008",   # FastAPI Depends pattern
  "N806",   # variable in function should be lowercase (we have ABI/SQL constants)
  "RUF012", # mutable class attrs
  "RUF001", # ambiguous unicode in strings (legitimate Russian text)
  "RUF002", # ambiguous unicode in docstrings (legitimate Russian text)
  "RUF003", # ambiguous unicode in comments (legitimate Russian text)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions/.*", "rust_ext/.*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
filterwarnings = [
  "ignore::DeprecationWarning:web3.*",
  "ignore::DeprecationWarning:solders.*",
]
